name: OffRecord
options:
  bundleIdPrefix: com.iletai
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Lets Xcode extract String(localized:)/Text keys into the string catalogs.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Staging: debug
  Release-Staging: release
  Debug-Prod: debug
  Release-Prod: release

# One xcconfig per environment; contract in skill ios-new-app references/environments.md.
configFiles:
  Debug-Dev: Config/Dev.xcconfig
  Release-Dev: Config/Dev.xcconfig
  Debug-Staging: Config/Staging.xcconfig
  Release-Staging: Config/Staging.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig

# Own libraries (versions + integration snippets): skill `iletai-libs`; new_app.sh --with adds them here.
packages:
  BaseNavigationStack:
    url: https://github.com/iletai/BaseNavigationStack.git
    from: 2.1.0

targets:
  OffRecord:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        # Own variable: a project-level PRODUCT_BUNDLE_IDENTIFIER would also give the test bundles the app's id.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Debug-* keep DEBUG on top of the env condition from the xcconfig (partial match on config name).
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
    dependencies:
      - package: BaseNavigationStack
    info:
      path: App/Info.plist
      properties:
        # Xcode silently drops INFOPLIST_KEY_<custom> build settings, so every custom key lives here.
        UILaunchScreen: {}
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's built-in encryption; avoids "Missing Compliance" on every build.
        ITSAppUsesNonExemptEncryption: false
        # Store page for update prompts / share links; empty until the ASC record exists.
        APP_STORE_URL: $(APP_STORE_URL)
        # dev | staging | prod, read by AppConfiguration.environment.
        APP_ENV: $(APP_ENV)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Subscription group of this environment's ASC record (Dev: same id as App/StoreKit/Products.storekit).
        SUBSCRIPTION_GROUP_ID: $(SUBSCRIPTION_GROUP_ID)
        # Plain-language, on-device promises; review reads these (PLAN.md §5).
        NSMicrophoneUsageDescription: OffRecord records the session on this iPhone so it can be transcribed here. Audio is never uploaded.
        NSSpeechRecognitionUsageDescription: OffRecord uses on-device speech recognition to turn your recording into a transcript. Audio never leaves this iPhone.
        # Legal pages linked from the paywall (App Review 3.1.2 requires both in-app).
        LEGAL_TERMS_URL: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/
        LEGAL_PRIVACY_URL: https://apps-site-six.vercel.app/apps/offrecord/privacy
        # Recording continues while the screen is locked (PLAN.md §4.1).
        UIBackgroundModes:
          - audio

  OffRecordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # CODE_SIGN_ENTITLEMENTS comes from the project-level xcconfig (app entitlements); a test bundle must not claim them.
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: OffRecord

  OffRecordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # CODE_SIGN_ENTITLEMENTS comes from the project-level xcconfig (app entitlements); a test bundle must not claim them.
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: OffRecord

schemes:
  # Dev owns the test targets; every scheme archives with its Release-* config.
  OffRecord-Dev:
    build:
      targets:
        OffRecord: all
        OffRecordTests: [test]
        OffRecordUITests: [test]
    run:
      config: Debug-Dev
      storeKitConfiguration: App/StoreKit/Products.storekit
    test:
      config: Debug-Dev
      gatherCoverageData: true
      coverageTargets:
        - OffRecord
      targets:
        - OffRecordTests
        - OffRecordUITests
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  OffRecord-Staging:
    build:
      targets:
        OffRecord: all
    run:
      config: Debug-Staging
    profile:
      config: Release-Staging
    analyze:
      config: Debug-Staging
    archive:
      config: Release-Staging
  OffRecord:
    build:
      targets:
        OffRecord: all
    run:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
